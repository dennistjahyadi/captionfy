plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.burnin'
version = '0.1.0'

android {
  namespace "expo.modules.burnin"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }

  sourceSets {
    main {
      // The same five files the preview measures with, packed where Android can
      // open them as typefaces. Pointed at the app's own fonts directory rather
      // than copied, because two copies of a font file is one chance for the
      // export to draw with a face the preview never saw (invariant 2).
      assets.srcDirs += ['../../../assets/fonts']
    }
  }
}
